name: Dead man's switch

# Makes this repository public once the date in deadline.txt (UTC) has arrived.
# To postpone: commit a new, later date to deadline.txt before then.

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC); GitHub may delay runs by several minutes
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would happen, do not change visibility"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check deadline and publish if it has passed
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Secret REPO_ADMIN_TOKEN is not set."
            exit 1
          fi

          deadline="$(tr -d '[:space:]' < deadline.txt)"
          if ! [[ "$deadline" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::deadline.txt must contain a date like 2027-01-01 (got '$deadline')."
            exit 1
          fi

          today="$(date -u +%F)"
          visibility="$(gh api "repos/$REPO" --jq .visibility)"
          echo "Today (UTC): $today | Deadline: $deadline | Visibility: $visibility"

          if [ "$visibility" = "public" ]; then
            echo "Already public. Nothing to do."
            exit 0
          fi

          # ISO dates compare correctly as strings
          if [[ "$today" < "$deadline" ]]; then
            echo "Deadline not reached yet. Staying private."
            exit 0
          fi

          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "DRY RUN: deadline passed, would make the repository public."
            exit 0
          fi

          echo "Deadline passed. Making repository public."
          gh api -X PATCH "repos/$REPO" -f visibility=public \
            -F private=false >/dev/null 2>&1 \
            || gh api -X PATCH "repos/$REPO" -f visibility=public
          echo "Done: $(gh api "repos/$REPO" --jq .visibility)"
